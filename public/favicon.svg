<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Gold Border -->
  <circle cx="100" cy="100" r="96" fill="#3B0C4E" stroke="#CFA022" stroke-width="8" />

  <!-- Concentric Geometric Diamond Crest (Top Emblem) -->
  <g stroke="#E0B32E" stroke-width="2.5" fill="none">
    <!-- Outer Square -->
    <rect x="75" y="32" width="50" height="50" transform="rotate(0 100 57)" />
    <!-- Rotated 45 deg Square -->
    <rect x="75" y="32" width="50" height="50" transform="rotate(45 100 57)" />
    <!-- Inner Square -->
    <rect x="80" y="37" width="40" height="40" transform="rotate(0 100 57)" />
    <!-- Inner Rotated 45 deg Square -->
    <rect x="80" y="37" width="40" height="40" transform="rotate(45 100 57)" />
  </g>

  <!-- Cursive "SPC" in Center of Top Crest -->
  <text 
    x="100" 
    y="62" 
    font-family="'Brush Script MT', 'Great Vibes', 'Playfair Display', cursive, serif" 
    font-style="italic"
    font-size="24" 
    font-weight="bold" 
    fill="#E8BD35" 
    text-anchor="middle"
  >
    SPC
  </text>

  <!-- Main Text: "Sri Parshwa Cards" -->
  <text 
    x="100" 
    y="125" 
    font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', cursive, sans-serif" 
    font-style="italic"
    font-size="24" 
    font-weight="bold" 
    fill="#E8BD35" 
    text-anchor="middle"
  >
    Sri Parshwa Cards
  </text>

  <!-- Subtitle: "EXCLUSIVE WEDDING INVITATIONS" -->
  <text 
    x="100" 
    y="142" 
    font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" 
    font-size="8.5" 
    font-weight="700" 
    letter-spacing="1.2" 
    fill="#E8BD35" 
    text-anchor="middle"
  >
    EXCLUSIVE WEDDING INVITATIONS
  </text>
</svg>